name: Daily Senior Living Digest

on:
  schedule:
    # 08:23 UTC = 3:23am CDT / 2:23am CST -- early AM year round, and off the hour
    # on purpose. GitHub queues scheduled workflows behind everyone else's, and the
    # backlog is worst at :00 on a round hour. This job was set to "0 9" and the
    # twelve scheduled runs before 2026-09-06 actually started 12:14-20:32 UTC:
    # 3.5 to 11.5 hours late, landing the digest at 8-9am local most days and
    # mid-afternoon twice. An odd minute does not eliminate the drift -- nothing in
    # Actions can -- but it starts the wait from a much shorter queue. MEA-231.
    - cron: "23 8 * * *"

  # Allow manual runs with an optional focus override
  workflow_dispatch:
    inputs:
      focus:
        description: >
          Subject focus override (leave blank to use today's rotation).
          Examples: "dementia", "falls", "nutrition"
        required: false
        default: ""

jobs:
  digest:
    name: Generate senior living digest
    runs-on: ubuntu-latest
    # Healthy runs finish in ~6 min; cap the job so a hang fails fast
    # instead of burning the 6-hour default (see the 2026-08-08 run).
    timeout-minutes: 30

    permissions:
      contents: write   # Needed to commit digest files back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      # The parsers that build the dashboard are regexes over model prose. They
      # have drifted silently before; running the suite here is what makes that
      # loud. Cheap -- it touches no API.
      - name: Run tests
        run: python -m pytest tests/ -q

      # PYTHONUNBUFFERED is what makes a hang diagnosable. Python block-buffers
      # stdout when it is a pipe, so when the 2026-09-06 run was killed at the
      # 20-minute cap the entire log died in the buffer -- the step reported
      # zero output even though main.py prints a banner before its first
      # network call. Unbuffered, the next hang names the stage it died in.
      - name: Run digest pipeline
        timeout-minutes: 20
        env:
          PYTHONUNBUFFERED: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          DIGEST_FOCUS: ${{ github.event.inputs.focus }}
        working-directory: scripts
        run: python main.py

      - name: Commit digest outputs
        run: |
          git config user.name  "senior-living-digest-bot"
          git config user.email "bot@users.noreply.github.com"
          # Add only the directories that exist. `state/` holds the web-coverage
          # cache and is created lazily on the first run that stores something,
          # so on a run where coverage is skipped or fully cached it is absent --
          # and `git add` on a missing pathspec is fatal, not a warning. That
          # took down the 2026-09-06 23:25 run *after* the pipeline had
          # succeeded, discarding a digest that was already written.
          # `if`, not `[ -d ] &&` -- the step runs under `bash -e`, and a
          # short-circuited && on the final iteration is a non-zero loop status,
          # which would fail the step for the exact reason we are fixing.
          for dir in outputs topic_memory docs state; do
            if [ -d "$dir" ]; then git add "$dir"; fi
          done
          git diff --cached --quiet || git commit -m "digest: $(date -u +%Y-%m-%d)"
          git push

      - name: Deploy dashboard to Vercel
        timeout-minutes: 10
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ILjarBqrMdxa47xLA4bqqQfq
          VERCEL_PROJECT_ID: prj_wWFV5jrdnYlKq2pX3wZSVCo0sR6v
        working-directory: docs
        run: npx --yes vercel@latest deploy --prod --token="$VERCEL_TOKEN" --yes
