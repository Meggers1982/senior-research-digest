<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Senior Living Research Digest — Dashboard</title>
<style>
  :root {
    /* Measured from the live header on load/resize; the literal is the desktop fallback. */
    --header-h: 91px;
    --bg: #f7f5f2;
    --panel: #ffffff;
    --border: #e4ddd3;
    --text: #2b2622;
    --muted: #6f6759;
    --accent: #7a5c3e;
    --accent-soft: #efe6d9;
    --good: #2f7a4f;
    --warn: #a5710f;
    --bad: #b23b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17;
      --panel: #262320;
      --border: #3a352e;
      --text: #efe9e0;
      --muted: #a89d8c;
      --accent: #d9b98a;
      --accent-soft: #332c22;
      --good: #6fcf94;
      --warn: #e0ac4f;
      --bad: #e07a7a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1a17; --panel: #262320; --border: #3a352e; --text: #efe9e0;
    --muted: #a89d8c; --accent: #d9b98a; --accent-soft: #332c22;
    --good: #6fcf94; --warn: #e0ac4f; --bad: #e07a7a;
  }
  :root[data-theme="light"] {
    --bg: #f7f5f2; --panel: #ffffff; --border: #e4ddd3; --text: #2b2622;
    --muted: #6f6759; --accent: #7a5c3e; --accent-soft: #efe6d9;
    --good: #2f7a4f; --warn: #a5710f; --bad: #b23b3b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
  }
  header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { margin: 0 0 4px; font-size: 1.3rem; }
  header h1 a { color: inherit; text-decoration: none; }
  header h1 a:hover { text-decoration: underline; }
  header p { margin: 0; color: var(--muted); font-size: 0.85rem; }
  .layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 0;
    align-items: start;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }
  .sidebar {
    border-right: 1px solid var(--border);
    padding: 16px;
    max-height: calc(100vh - var(--header-h));
    overflow-y: auto;
    position: sticky;
    top: var(--header-h);
  }
  @media (max-width: 860px) {
    .sidebar { position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--border); }
    /* Stacked above the digest on phones, so cap it instead of pushing content off-screen. */
    .sidebar .run-list { max-height: 45vh; overflow-y: auto; }
  }
  .controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  input[type="search"], select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    font-size: 0.9rem;
  }
  .run-list { display: flex; flex-direction: column; gap: 8px; }
  .run-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    background: var(--panel);
    transition: border-color 0.15s;
  }
  .run-card:hover { border-color: var(--accent); }
  .run-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
  .run-card.active { border-color: var(--accent); background: var(--accent-soft); }
  .run-card .rc-title { font-weight: 600; font-size: 0.88rem; margin-bottom: 3px; }
  .run-card .rc-meta { font-size: 0.75rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    display: inline-block;
    font-size: 0.7rem;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid var(--border);
  }
  main { padding: 24px 28px 60px; min-width: 0; }
  .empty-state { color: var(--muted); padding: 40px 0; text-align: center; }
  .run-header { margin-bottom: 20px; }
  .run-header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .run-header h2 { margin: 0 0 8px; font-size: 1.4rem; }
  .run-header .meta-row { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 0.85rem; }
  .export-btn {
    flex-shrink: 0;
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .export-btn:hover { border-color: var(--accent); }
  .export-btn:disabled { opacity: 0.6; cursor: default; }
  .fact-summary {
    margin-top: 10px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .study {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .study h3 { margin: 0 0 8px; font-size: 1.05rem; }
  .study .study-meta { font-size: 0.78rem; color: var(--muted); margin-bottom: 10px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .study .study-meta a { color: var(--accent); text-decoration: none; }
  .study .study-meta a:hover { text-decoration: underline; }
  .verdict { font-size: 0.75rem; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); }
  .verdict.good { color: var(--good); }
  .verdict.warn { color: var(--warn); }
  .verdict.bad { color: var(--bad); }
  .study .field-label { font-weight: 600; font-size: 0.82rem; margin-top: 10px; }
  .study .field-body { font-size: 0.9rem; margin-top: 2px; }
  .story-angle { margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--border); font-size: 0.88rem; }
  .story-angle b { color: var(--accent); }
  .section-block {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    padding: 16px 18px;
    margin-top: 22px;
    font-size: 0.9rem;
  }
  .section-block h4 { margin: 0 0 8px; font-size: 1rem; }
  #feature-pitch { scroll-margin-top: calc(var(--header-h) + 12px); }
  .jump-link {
    display: inline-block;
    margin-top: 10px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--border);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 9px 14px;
  }
  .jump-link:hover { border-color: var(--accent); }
  .section-block b { color: var(--accent); }
  .section-block ul { margin: 4px 0 10px 18px; padding: 0; }
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
  .citation-table { width: 100%; border-collapse: collapse; margin-top: 22px; font-size: 0.82rem; }
  .citation-table th, .citation-table td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; }
  .citation-table th { background: var(--accent-soft); }
  details.raw-toggle { margin-top: 10px; font-size: 0.82rem; color: var(--muted); }
  details.raw-toggle summary { cursor: pointer; }
  #scroll-top-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    opacity: 0;
    visibility: hidden;
    transform: translateY(8px);
    transition: opacity 0.15s, transform 0.15s, visibility 0.15s;
    z-index: 20;
  }
  #scroll-top-btn.visible { opacity: 1; visibility: visible; transform: translateY(0); }
  #scroll-top-btn:hover { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1><a href="#" id="home-link">Senior Living Research Digest</a></h1>
  <p>Full run history — every digest ever generated, browsable by topic and date.</p>
</header>
<div class="layout">
  <aside class="sidebar">
    <div class="controls">
      <label class="sr-only" for="search">Search digests by headline, PMID, or journal</label>
      <input type="search" id="search" placeholder="Search headline, PMID, journal…" />
      <label class="sr-only" for="topic-filter">Filter by topic</label>
      <select id="topic-filter">
        <option value="">All topics</option>
      </select>
    </div>
    <div id="run-count" style="color: var(--muted); font-size: 0.78rem; margin-bottom: 8px;"></div>
    <div class="run-list" id="run-list"></div>
  </aside>
  <main id="main">
    <div class="empty-state">Loading digest history…</div>
  </main>
</div>
<button id="scroll-top-btn" title="Back to top" aria-label="Back to top">&#8593;</button>
<script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
<script>
const state = { data: null, filtered: [], activeId: null };

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function verdictClass(verdict) {
  if (!verdict) return "";
  if (verdict.includes("✅")) return "good";
  if (verdict.includes("⚠️")) return "warn";
  if (verdict.includes("❌")) return "bad";
  return "";
}

function renderSidebar() {
  const topicSelect = document.getElementById("topic-filter");
  topicSelect.innerHTML = '<option value="">All topics</option>' +
    state.data.topics.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join("");

  const list = document.getElementById("run-list");
  list.innerHTML = state.filtered.map(r => `
    <div class="run-card ${r.id === state.activeId ? "active" : ""}" data-id="${r.id}"
         role="button" tabindex="0" aria-current="${r.id === state.activeId ? "true" : "false"}">
      <div class="rc-title">${escapeHtml(r.topic || "Broad")}</div>
      <div class="rc-meta">
        <span>${escapeHtml(r.run_date || "—")}</span>
        <span class="badge">${r.study_count} studies</span>
        ${r.fact_check && r.fact_check.summary ? `<span class="badge">${escapeHtml(r.fact_check.summary.total_issues || "")} issues</span>` : ""}
      </div>
    </div>
  `).join("") || '<div class="empty-state">No runs match.</div>';

  document.getElementById("run-count").textContent =
    `${state.filtered.length} of ${state.data.run_count} runs`;

  list.querySelectorAll(".run-card").forEach(el => {
    const select = () => {
      // Check before re-rendering: the rebuild below detaches el and clears activeElement.
      const hadFocus = document.activeElement === el;
      const id = el.dataset.id;
      state.activeId = id;
      renderSidebar();
      renderMain();
      if (hadFocus) {
        const next = document.querySelector(`.run-card[data-id="${id}"]`);
        if (next) next.focus();
      }
    };
    el.addEventListener("click", select);
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(); }
    });
  });
}

function renderTrendsBlock(raw) {
  if (!raw) return "";
  // Render **Label:** paragraphs and "- " bullet lists without a full markdown parser.
  const lines = raw.split("\n");
  let html = "";
  let inList = false;
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    const bullet = trimmed.match(/^-\s+(.*)$/);
    if (bullet) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${inlineMd(bullet[1])}</li>`;
    } else {
      if (inList) { html += "</ul>"; inList = false; }
      html += `<p>${inlineMd(trimmed)}</p>`;
    }
  }
  if (inList) html += "</ul>";
  return html;
}

function inlineMd(text) {
  // Bold first, so the leftover single asterisks are unambiguously emphasis.
  return escapeHtml(text)
    .replace(/\*\*([^*]+?)\*\*/g, "<b>$1</b>")
    .replace(/\*([^*]+?)\*/g, "<i>$1</i>");
}

function renderStudy(study, factCheck) {
  const verdict = factCheck && factCheck.verdicts_by_pmid ? factCheck.verdicts_by_pmid[study.pmid] : null;
  return `
    <div class="study">
      <h3>${study.number}. ${escapeHtml(study.title)}</h3>
      <div class="study-meta">
        <span>${escapeHtml(study.journal)}</span>
        <span>${escapeHtml(study.published)}</span>
        ${study.pmid ? `<a href="https://pubmed.ncbi.nlm.nih.gov/${escapeHtml(study.pmid)}/" target="_blank" rel="noopener">PMID ${escapeHtml(study.pmid)}</a>` : ""}
        ${study.doi ? `<span>DOI: ${escapeHtml(study.doi)}</span>` : ""}
        ${verdict ? `<span class="verdict ${verdictClass(verdict)}">${escapeHtml(verdict)}</span>` : ""}
      </div>
      <div class="field-label">The study</div>
      <div class="field-body">${escapeHtml(study.the_study) || "—"}</div>
      <div class="field-label">Why it matters</div>
      <div class="field-body">${escapeHtml(study.why_it_matters) || "—"}</div>
      <div class="field-label">Story angles</div>
      <div class="story-angle"><b>To audience:</b> ${escapeHtml(study.story_angle_primary) || "—"}</div>
      <div class="story-angle"><b>About audience:</b> ${escapeHtml(study.story_angle_secondary) || "—"}</div>
      <div class="field-label">Caveats</div>
      <div class="field-body">${escapeHtml(study.caveats) || "—"}</div>
    </div>
  `;
}

function renderMain() {
  const main = document.getElementById("main");
  const run = state.data.runs.find(r => r.id === state.activeId);
  if (!run) {
    main.innerHTML = '<div class="empty-state">Select a run from the list to view its studies.</div>';
    return;
  }

  const factSummary = run.fact_check && run.fact_check.summary
    ? `<div class="fact-summary">Fact check: ${escapeHtml(run.fact_check.summary.total_issues)} total issues · ${escapeHtml(run.fact_check.summary.entries_requiring_revision)} entries need revision · ${escapeHtml(run.fact_check.summary.entries_cleared)} cleared</div>`
    : (run.fact_check ? `<div class="fact-summary">Fact check available (no summary table found)</div>` : "");

  const studiesHtml = run.studies.map(s => renderStudy(s, run.fact_check)).join("");

  const citationHtml = run.citation_table.length ? `
    <div class="table-scroll">
    <table class="citation-table">
      <thead><tr><th>PMID</th><th>Journal</th><th>Date</th><th>DOI</th></tr></thead>
      <tbody>
        ${run.citation_table.map(c => `<tr><td>${escapeHtml(c.pmid)}</td><td>${escapeHtml(c.journal)}</td><td>${escapeHtml(c.date)}</td><td>${escapeHtml(c.doi)}</td></tr>`).join("")}
      </tbody>
    </table>
    </div>
  ` : "";

  const trendsHtml = run.trends_raw ? `
    <div class="section-block">
      <h4>Research Trends &amp; Continuity</h4>
      ${renderTrendsBlock(run.trends_raw)}
    </div>
  ` : "";

  const pitchHtml = run.feature_pitch_raw ? `
    <div class="section-block" id="feature-pitch">
      <h4>Bigger Picture: Feature Pitch</h4>
      ${renderTrendsBlock(run.feature_pitch_raw)}
    </div>
  ` : "";

  const jumpLinkHtml = run.feature_pitch_raw
    ? `<a class="jump-link" href="#feature-pitch">Jump to Feature Pitch &#8595;</a>`
    : "";

  const rawFactCheckHtml = run.fact_check && run.fact_check.raw ? `
    <details class="raw-toggle">
      <summary>View full fact-check report</summary>
      <pre style="white-space: pre-wrap; font-family: inherit;">${escapeHtml(run.fact_check.raw)}</pre>
    </details>
  ` : "";

  main.innerHTML = `
    <div class="run-header">
      <div class="run-header-top">
        <h2>${escapeHtml(run.title)}</h2>
        <button id="export-docx-btn" class="export-btn">Export .docx</button>
      </div>
      <div class="meta-row">
        <span>Run date: ${escapeHtml(run.run_date)}</span>
        <span>Coverage: ${escapeHtml(run.coverage_window)}</span>
        <span>Journals searched: ${escapeHtml(run.journals_searched)}</span>
        <span>Articles screened: ${escapeHtml(run.articles_screened)}</span>
        <span>Studies selected: ${run.study_count}</span>
      </div>
      ${factSummary}
      ${jumpLinkHtml}
    </div>
    ${studiesHtml}
    ${citationHtml}
    ${trendsHtml}
    ${pitchHtml}
    ${rawFactCheckHtml}
  `;

  const exportBtn = document.getElementById("export-docx-btn");
  if (exportBtn) exportBtn.addEventListener("click", () => exportRunToDocx(run));

  const jumpLink = main.querySelector(".jump-link");
  if (jumpLink) jumpLink.addEventListener("click", (e) => {
    e.preventDefault();
    const target = document.getElementById("feature-pitch");
    if (!target) return;
    const header = document.querySelector("header");
    const offset = (header ? header.getBoundingClientRect().height : 0) + 12;
    window.scrollTo({ top: target.getBoundingClientRect().top + window.scrollY - offset, behavior: "smooth" });
  });
}

function mdRuns(text) {
  const parts = String(text || "").split(/(\*\*[^*]+?\*\*|\*[^*]+?\*)/g).filter(p => p !== "");
  if (!parts.length) return [new docx.TextRun("")];
  return parts.map(p => {
    const b = p.match(/^\*\*([^*]+)\*\*$/);
    if (b) return new docx.TextRun({ text: b[1], bold: true });
    const i = p.match(/^\*([^*]+)\*$/);
    if (i) return new docx.TextRun({ text: i[1], italics: true });
    return new docx.TextRun(p);
  });
}

function mdLiteParagraphs(raw) {
  const paras = [];
  for (const line of String(raw || "").split("\n")) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    const bullet = trimmed.match(/^-\s+(.*)$/);
    paras.push(bullet
      ? new docx.Paragraph({ children: mdRuns(bullet[1]), bullet: { level: 0 }, spacing: { after: 60 } })
      : new docx.Paragraph({ children: mdRuns(trimmed), spacing: { after: 120 } }));
  }
  return paras;
}

function docxLabelBody(label, body) {
  return [
    new docx.Paragraph({ children: [new docx.TextRun({ text: label, bold: true })], spacing: { before: 160, after: 40 } }),
    new docx.Paragraph({ text: body || "—", spacing: { after: 80 } }),
  ];
}

function docxStudyMeta(study, verdict) {
  const children = [];
  const push = (text) => {
    if (children.length) children.push(new docx.TextRun({ text: "   ·   ", color: "888888" }));
    children.push(new docx.TextRun({ text, color: "555555", size: 18 }));
  };
  if (study.journal) push(study.journal);
  if (study.published) push(study.published);
  if (study.pmid) {
    if (children.length) children.push(new docx.TextRun({ text: "   ·   ", color: "888888" }));
    children.push(new docx.ExternalHyperlink({
      link: `https://pubmed.ncbi.nlm.nih.gov/${study.pmid}/`,
      children: [new docx.TextRun({ text: `PMID ${study.pmid}`, color: "0563C1", underline: {}, size: 18 })],
    }));
  }
  if (study.doi) push(`DOI: ${study.doi}`);
  if (verdict) push(verdict);
  return new docx.Paragraph({ children, spacing: { after: 120 } });
}

function docxStudySection(study, factCheck) {
  const verdict = factCheck && factCheck.verdicts_by_pmid ? factCheck.verdicts_by_pmid[study.pmid] : null;
  return [
    new docx.Paragraph({ text: `${study.number}. ${study.title}`, heading: docx.HeadingLevel.HEADING_2, spacing: { before: 280, after: 60 } }),
    docxStudyMeta(study, verdict),
    ...docxLabelBody("The study", study.the_study),
    ...docxLabelBody("Why it matters", study.why_it_matters),
    new docx.Paragraph({ children: [new docx.TextRun({ text: "Story angles", bold: true })], spacing: { before: 160, after: 40 } }),
    new docx.Paragraph({ children: [new docx.TextRun({ text: "To audience: ", bold: true }), new docx.TextRun(study.story_angle_primary || "—")], spacing: { after: 40 } }),
    new docx.Paragraph({ children: [new docx.TextRun({ text: "About audience: ", bold: true }), new docx.TextRun(study.story_angle_secondary || "—")], spacing: { after: 80 } }),
    ...docxLabelBody("Caveats", study.caveats),
  ];
}

function docxCitationTable(rows) {
  if (!rows || !rows.length) return [];
  const headerRow = new docx.TableRow({
    children: ["PMID", "Journal", "Date", "DOI"].map(h => new docx.TableCell({
      shading: { fill: "EFE6D9" },
      children: [new docx.Paragraph({ children: [new docx.TextRun({ text: h, bold: true })] })],
    })),
  });
  const bodyRows = rows.map(r => new docx.TableRow({
    children: [r.pmid, r.journal, r.date, r.doi].map(v => new docx.TableCell({
      children: [new docx.Paragraph(String(v || ""))],
    })),
  }));
  return [
    new docx.Paragraph({ text: "Citations", heading: docx.HeadingLevel.HEADING_2, spacing: { before: 280, after: 80 } }),
    new docx.Table({ width: { size: 100, type: docx.WidthType.PERCENTAGE }, rows: [headerRow, ...bodyRows] }),
  ];
}

async function exportRunToDocx(run) {
  const btn = document.getElementById("export-docx-btn");
  if (btn) { btn.disabled = true; btn.textContent = "Exporting…"; }
  try {
    if (typeof docx === "undefined") throw new Error("docx library failed to load");

    const sections = [
      new docx.Paragraph({ text: run.title, heading: docx.HeadingLevel.TITLE, spacing: { after: 120 } }),
      new docx.Paragraph({
        children: [
          new docx.TextRun(`Run date: ${run.run_date || "—"}`),
          new docx.TextRun("    |    "), new docx.TextRun(`Coverage: ${run.coverage_window || "—"}`),
          new docx.TextRun("    |    "), new docx.TextRun(`Journals searched: ${run.journals_searched || "—"}`),
          new docx.TextRun("    |    "), new docx.TextRun(`Articles screened: ${run.articles_screened || "—"}`),
          new docx.TextRun("    |    "), new docx.TextRun(`Studies selected: ${run.study_count}`),
        ],
        spacing: { after: 80 },
      }),
    ];

    if (run.fact_check && run.fact_check.summary) {
      const s = run.fact_check.summary;
      sections.push(new docx.Paragraph({
        children: [new docx.TextRun({
          text: `Fact check: ${s.total_issues} total issues · ${s.entries_requiring_revision} entries need revision · ${s.entries_cleared} cleared`,
          italics: true, color: "6f6759",
        })],
        spacing: { after: 200 },
      }));
    }

    run.studies.forEach(s => sections.push(...docxStudySection(s, run.fact_check)));
    sections.push(...docxCitationTable(run.citation_table));

    if (run.trends_raw) {
      sections.push(new docx.Paragraph({ text: "Research Trends & Continuity", heading: docx.HeadingLevel.HEADING_2, spacing: { before: 320, after: 80 } }));
      sections.push(...mdLiteParagraphs(run.trends_raw));
    }
    if (run.feature_pitch_raw) {
      sections.push(new docx.Paragraph({ text: "Bigger Picture: Feature Pitch", heading: docx.HeadingLevel.HEADING_2, spacing: { before: 320, after: 80 } }));
      sections.push(...mdLiteParagraphs(run.feature_pitch_raw));
    }

    const doc = new docx.Document({ sections: [{ properties: {}, children: sections }] });
    const blob = await docx.Packer.toBlob(doc);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${(run.title || "digest").replace(/[\\/:*?"<>|]/g, "-")}.docx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (err) {
    alert("Failed to export .docx: " + err.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "Export .docx"; }
  }
}

function applyFilters() {
  const query = document.getElementById("search").value.trim().toLowerCase();
  const topic = document.getElementById("topic-filter").value;

  state.filtered = state.data.runs.filter(r => {
    if (topic && r.topic !== topic) return false;
    if (!query) return true;
    const haystack = [
      r.title, r.focus, r.topic,
      ...r.studies.flatMap(s => [s.title, s.pmid, s.journal])
    ].join(" ").toLowerCase();
    return haystack.includes(query);
  });

  if (!state.filtered.some(r => r.id === state.activeId)) {
    state.activeId = state.filtered.length ? state.filtered[0].id : null;
  }

  renderSidebar();
  renderMain();
}

function syncHeaderHeight() {
  const header = document.querySelector("header");
  if (!header) return;
  const apply = () => document.documentElement.style.setProperty(
    "--header-h", header.getBoundingClientRect().height + "px");
  apply();
  if (window.ResizeObserver) new ResizeObserver(apply).observe(header);
  else window.addEventListener("resize", apply);
}

function initScrollTopButton() {
  const btn = document.getElementById("scroll-top-btn");
  window.addEventListener("scroll", () => {
    btn.classList.toggle("visible", window.scrollY > 400);
  }, { passive: true });
  btn.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
}

async function init() {
  const res = await fetch("data/digests.json");
  state.data = await res.json();
  state.filtered = state.data.runs;
  state.activeId = state.filtered.length ? state.filtered[0].id : null;

  document.getElementById("search").addEventListener("input", applyFilters);
  document.getElementById("topic-filter").addEventListener("change", applyFilters);
  document.getElementById("home-link").addEventListener("click", (e) => {
    e.preventDefault();
    document.getElementById("search").value = "";
    document.getElementById("topic-filter").value = "";
    applyFilters();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  initScrollTopButton();
  syncHeaderHeight();

  renderSidebar();
  renderMain();
}

init().catch(err => {
  document.getElementById("main").innerHTML =
    `<div class="empty-state">Failed to load digest data: ${escapeHtml(err.message)}</div>`;
});
</script>
</body>
</html>
