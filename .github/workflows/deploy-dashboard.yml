# Publish docs/ to Vercel without running the pipeline.
#
# Vercel's Git integration is deliberately disconnected for this repo, so pushing
# to main does not redeploy. Before this workflow existed the only ways to
# publish a dashboard change were to wait for the 09:00 UTC digest or to run the
# Vercel CLI by hand -- and the daily run spends real Anthropic and SerpAPI money
# to regenerate a digest nobody asked for. A markup or styling change needs
# neither.
#
# Run it from Actions -> "Deploy dashboard" -> Run workflow.
name: Deploy dashboard

on:
  workflow_dispatch:

concurrency:
  group: deploy-dashboard
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write   # the rebuild step may commit refreshed docs/data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Rebuilding from the committed outputs/ means a scoring or parser change
      # reaches the dashboard without a pipeline run. It touches no API.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      # This workflow exists for scoring and parser changes, which is exactly
      # what the suite was added to catch -- and it was the one route that
      # shipped them to production without running it.
      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Record the run count before rebuilding
        id: before
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          p = pathlib.Path("docs/data/index.json")
          runs = json.loads(p.read_text())["runs"] if p.exists() else []
          print(f"count={len(runs)}")
          PY

      - name: Rebuild dashboard data
        working-directory: scripts
        run: python build_dashboard_data.py

      # build_dashboard_data deletes any runs/*.json not in the freshly built
      # set, so a parser regression that made build() return nothing would wipe
      # the archive, publish an empty index, and report success at every step.
      - name: Refuse to publish a collapsed archive
        env:
          BEFORE: ${{ steps.before.outputs.count }}
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          before = int(os.environ["BEFORE"])
          after = len(json.loads(pathlib.Path("docs/data/index.json").read_text())["runs"])
          print(f"runs before={before} after={after}")
          # Runs are only ever added, so any drop is a parsing failure rather
          # than a legitimate edit. One is tolerated for a hand-removed file.
          if before and after < before - 1:
              sys.exit(f"FAIL: run count fell {before} -> {after}; refusing to deploy")
          PY

      - name: Commit any data changes
        run: |
          git config user.name  "senior-living-digest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || {
            git commit -m "dashboard: rebuild data"
            git push
          }

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ILjarBqrMdxa47xLA4bqqQfq
          VERCEL_PROJECT_ID: prj_wWFV5jrdnYlKq2pX3wZSVCo0sR6v
        working-directory: docs
        run: npx --yes vercel@latest deploy --prod --token="$VERCEL_TOKEN" --yes
