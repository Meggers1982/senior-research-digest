name: Daily Senior Living Digest

on:
  schedule:
    # Runs at 09:00 UTC every day (adjust to taste)
    - cron: "0 9 * * *"

  # Allow manual runs with an optional focus override
  workflow_dispatch:
    inputs:
      focus:
        description: >
          Subject focus override (leave blank to use today's rotation).
          Examples: "dementia", "fall prevention", "nutrition"
        required: false
        default: ""

jobs:
  digest:
    name: Generate & email senior living digest
    runs-on: ubuntu-latest

    permissions:
      contents: write   # Needed to commit digest files back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          DIGEST_FOCUS: ${{ github.event.inputs.focus }}
        working-directory: scripts
        run: python main.py

      - name: Commit digest outputs
        run: |
          git config user.name  "senior-living-digest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add outputs/ topic_memory/
          git diff --cached --quiet || git commit -m "digest: $(date -u +%Y-%m-%d)"
          git push
